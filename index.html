<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Comercial - HTML</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    
    <style>
        body { 
            background-color: #f4f7f6; 
            font-family: 'Segoe UI', Arial, sans-serif; 
            padding: 20px; 
            margin: 0;
        }
        .container {
            background-color: white; 
            padding: 20px; 
            border-radius: 8px; 
            box-shadow: 0 4px 8px rgba(0,0,0,0.1); 
            overflow-x: auto;
        }
        
        /* --- ESTILOS DO CABEÇALHO E BOTÕES --- */
        .cabecalho-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 15px;
        }
        .espacador {
            flex: 1;
        }
        .titulo-container {
            flex: 2;
            text-align: center;
        }
        .botoes-container {
            flex: 1;
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }
        .btn-acao {
            background-color: #004578;
            color: white;
            padding: 8px 15px;
            text-decoration: none;
            border-radius: 5px;
            font-size: 13px;
            font-weight: bold;
            transition: background 0.2s;
            white-space: nowrap;
        }
        .btn-acao:hover {
            background-color: #00223d;
        }

        /* --- ESTILOS DA TABELA --- */
        .tabela-equipe { 
            width: 100%; 
            border-collapse: collapse; 
            font-size: 13px; 
        }
        .tabela-equipe thead tr { 
            background-color: #004578; 
            color: white; 
            text-align: center; 
            height: 35px; 
        }
        .tabela-equipe th, .tabela-equipe td { 
            padding: 8px; 
            border: 1px solid #ddd; 
        }
        .tabela-equipe tbody tr:nth-child(even) { background-color: #f0f4f8; }
        .tabela-equipe tbody tr:nth-child(odd) { background-color: #ffffff; }
        .tabela-equipe tbody tr:hover { background-color: #e2e8f0; } 
        
        .th-perc { 
            width: 35px; 
            padding: 4px; 
            font-size: 11px; 
            font-weight: normal; 
            background-color: #00335a; 
            border: 1px solid #ddd; 
        }
        .td-perc { 
            padding: 4px; 
            font-size: 11px; 
            font-weight: bold; 
            color: #666; 
            text-align: center; 
            border-right: 1px solid #ddd; 
            background-color: rgba(0,0,0,0.03); 
        }
        .rodape-perc { 
            padding: 4px; 
            font-size: 11px; 
            color: #fff; 
            background-color: #00223d; 
            text-align: center; 
            border-right: 1px solid #558bb5; 
        }
    </style>
</head>
<body>

    <div class="container">
        
        <div class="cabecalho-container">
            <div class="espacador"></div>
            
            <div class="titulo-container">
                <h2 style='color: #004578; margin-bottom: 5px; margin-top: 0;'>Acompanhamento de Envios - Equipe Comercial</h2>
                <p id="texto-atualizacao" style='color: #666; font-size: 12px; margin: 0;'>Atualizando base de dados...</p>
            </div>
            
            <div class="botoes-container">
                <a href="https://docs.google.com/forms/d/e/1FAIpQLSfvCfAliGnPFb7hqlgR9oaJDVfrEj_XGAmBVAqDYcAreVxkaA/viewform" target="_blank" class="btn-acao">Formulário</a>
                <a href="https://docs.google.com/spreadsheets/d/1wWKfaet9v-AtWNdohBTjjucmSryE0kHPZjc3vvRFerU/edit?gid=607242638#gid=607242638" target="_blank" class="btn-acao">Histórico</a>
                <a href="https://docs.google.com/spreadsheets/d/1qO5aeaxKvcFMvLQ327yJDeuzaMFmJ4znMWNizvm3aO4/edit?gid=665822156#gid=665822156" target="_blank" class="btn-acao">Base</a>
            </div>
        </div>
        
        <table class='tabela-equipe' id="tabela-dashboard">
            <thead id="cabecalho-tabela">
                </thead>
            <tbody id="corpo-tabela">
                <tr><td colspan="22" style="text-align: center;">Buscando dados no servidor...</td></tr>
            </tbody>
            <tfoot id="rodape-tabela">
                </tfoot>
        </table>
    </div>

    <script>
        // 1. Links de origem
        const urlBase = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQySFFFFCw7rifwK1Ipj3-9yq8eljPL7Hn5RUFTpQgrFxraRqmz0ne52yqB41cHHhPzh1EhZj0Nxd_-/pub?gid=665822156&single=true&output=csv";
        const urlForms = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSdLALJKkM-j33amnh8heU_xsCvhuKGNjjtVbuMVxDnz-VPz1sB9q2kNALr8bee8iRmhPErv9LCgyxw/pub?output=csv";

        // Nomes dos Relatórios
        const rel1 = "Atualização dos PEX";
        const rel2 = "Atualização das campanhas";
        const rel3 = "Padronização das metas para o app";
        const rel4 = "Demais acompanhamentos";

        // Auxiliar para formatação de números inteiros/decimais
        function formatNum(valor) {
            if (valor === undefined || valor === null || isNaN(valor)) return 0;
            return (valor % 1 !== 0) ? valor.toFixed(1) : valor;
        }

        function formatarPerc(valor, total) {
            if (!total || total === 0) return "-";
            return Math.round((valor / total) * 100) + "%";
        }

        // Converte string 'DD/MM/YYYY HH:MM:SS' para objeto Date
        function parseDataHora(dataStr) {
            if (!dataStr) return null;
            const partes = dataStr.trim().split(" ");
            const dataPartes = partes[0].split(/[\/-]/);
            if (dataPartes.length < 3) return null;
            const dia = parseInt(dataPartes[0], 10);
            const mes = parseInt(dataPartes[1], 10) - 1; // Mês no JS é 0-11
            const ano = parseInt(dataPartes[2], 10);
            return new Date(ano, mes, dia);
        }

        // Calcula a semana do mês pelo calendário real (Segunda a Domingo)
        function getSemanaDoMes(data) {
            const primeiroDia = new Date(data.getFullYear(), data.getMonth(), 1);
            const diaDaSemanaInicio = (primeiroDia.getDay() + 6) % 7; // Segunda = 0, Domingo = 6
            const offset = data.getDate() + diaDaSemanaInicio - 1;
            const numSemana = Math.floor(offset / 7) + 1;
            return Math.min(numSemana, 5); // Limita em até 5 semanas
        }

        async function carregarDados() {
            try {
                const reqBase = new Promise(resolve => Papa.parse(urlBase, { download: true, header: false, skipEmptyLines: true, complete: resolve }));
                const reqForms = new Promise(resolve => Papa.parse(urlForms, { download: true, header: true, skipEmptyLines: true, complete: resolve }));
                
                const [resBase, resForms] = await Promise.all([reqBase, reqForms]);
                processarDados(resBase.data, resForms.data);
                
                // Atualiza o relógio na tela
                const agora = new Date();
                const dataFormatada = agora.toLocaleDateString('pt-BR');
                const horaFormatada = agora.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
                document.getElementById("texto-atualizacao").innerText = `Última atualização: ${dataFormatada} às ${horaFormatada} - Próxima em 30 min`;
                document.getElementById("texto-atualizacao").style.color = "#666";

            } catch (error) {
                console.error("Erro:", error);
                document.getElementById("texto-atualizacao").innerText = "Falha ao atualizar dados. Tentando novamente no próximo ciclo.";
                document.getElementById("texto-atualizacao").style.color = "red";
            }
        }

        function processarDados(baseArray, formsArray) {
            // Filtrar cabeçalho da Base
            const base = baseArray.filter(r => r[0] && r[0].toLowerCase() !== 'nome');
            
            // Filtrar respostas do Forms apenas para o MÊS e ANO VIGENTES
            const agora = new Date();
            const mesVigente = agora.getMonth();
            const anoVigente = agora.getFullYear();

            const forms = formsArray.filter(f => {
                const d = parseDataHora(f["Carimbo de data/hora"]);
                return d && d.getMonth() === mesVigente && d.getFullYear() === anoVigente;
            });

            // Extrair lista única de analistas ordenados
            const analistas = [...new Set(base.map(r => r[0]))].sort();

            let corpoHTML = "";
            
            // Variáveis de Totais Gerais
            let tReal = 0, tEsp = 0;
            let tRealT1 = 0, tEspT1 = 0, tRealT2 = 0, tEspT2 = 0;
            let tRealT3 = 0, tEspT3 = 0, tRealT4 = 0, tEspT4 = 0;
            
            let tSem1 = 0, tSem2 = 0, tSem3 = 0, tSem4 = 0, tSem5 = 0;
            let tEspSem1 = 0, tEspSem2 = 0, tEspSem3 = 0, tEspSem4 = 0, tEspSem5 = 0;

            analistas.forEach(nome => {
                let baseA = base.filter(r => r[0] === nome);
                let formsA = forms.filter(r => r["Nome"] === nome);

                // Esperado Total (Coluna G = índice 6)
                let vEsperadoTotal = baseA.reduce((sum, r) => sum + (parseFloat(r[6]) || 0), 0);
                let vRealizadoTotal = formsA.length;
                
                tEsp += vEsperadoTotal;
                tReal += vRealizadoTotal;

                // T1 a T4
                let vEspT1 = baseA.filter(r => parseInt(r[1]) === 1).reduce((sum, r) => sum + (parseFloat(r[6]) || 0), 0);
                let vRealT1 = formsA.filter(r => r["Relatório"] === rel1).length;
                tEspT1 += vEspT1; tRealT1 += vRealT1;

                let vEspT2 = baseA.filter(r => parseInt(r[1]) === 2).reduce((sum, r) => sum + (parseFloat(r[6]) || 0), 0);
                let vRealT2 = formsA.filter(r => r["Relatório"] === rel2).length;
                tEspT2 += vEspT2; tRealT2 += vRealT2;

                let vEspT3 = baseA.filter(r => parseInt(r[1]) === 3).reduce((sum, r) => sum + (parseFloat(r[6]) || 0), 0);
                let vRealT3 = formsA.filter(r => r["Relatório"] === rel3).length;
                tEspT3 += vEspT3; tRealT3 += vRealT3;

                let vEspT4 = baseA.filter(r => parseInt(r[1]) === 4).reduce((sum, r) => sum + (parseFloat(r[6]) || 0), 0);
                let vRealT4 = formsA.filter(r => r["Relatório"] === rel4).length;
                tEspT4 += vEspT4; tRealT4 += vRealT4;

                // Metas Exatas das Semanas 1 a 5 (Colunas H a L = Índices 7 a 11)
                let vEspSem1 = baseA.reduce((sum, r) => sum + (parseFloat(r[7]) || 0), 0);
                let vEspSem2 = baseA.reduce((sum, r) => sum + (parseFloat(r[8]) || 0), 0);
                let vEspSem3 = baseA.reduce((sum, r) => sum + (parseFloat(r[9]) || 0), 0);
                let vEspSem4 = baseA.reduce((sum, r) => sum + (parseFloat(r[10]) || 0), 0);
                let vEspSem5 = baseA.reduce((sum, r) => sum + (parseFloat(r[11]) || 0), 0);

                tEspSem1 += vEspSem1; tEspSem2 += vEspSem2; tEspSem3 += vEspSem3;
                tEspSem4 += vEspSem4; tEspSem5 += vEspSem5;

                // Contagem de Envios Realizados por Semana (Calendário Real)
                let vRealSem1 = 0, vRealSem2 = 0, vRealSem3 = 0, vRealSem4 = 0, vRealSem5 = 0;

                formsA.forEach(f => {
                    let d = parseDataHora(f["Carimbo de data/hora"]);
                    if (d) {
                        let numSemana = getSemanaDoMes(d);
                        if (numSemana === 1) vRealSem1++;
                        else if (numSemana === 2) vRealSem2++;
                        else if (numSemana === 3) vRealSem3++;
                        else if (numSemana === 4) vRealSem4++;
                        else if (numSemana === 5) vRealSem5++;
                    }
                });

                tSem1 += vRealSem1; tSem2 += vRealSem2; tSem3 += vRealSem3;
                tSem4 += vRealSem4; tSem5 += vRealSem5;

                corpoHTML += `
                <tr style='text-align: center; border-bottom: 1px solid #ddd; height: 40px;'>
                    <td style='padding: 8px; text-align: left;'><b>${nome}</b></td>
                    <td style='padding: 8px; font-weight: bold; color: #004578;'>${vRealizadoTotal}</td>
                    <td style='padding: 8px; font-weight: bold; color: #777;'>${formatNum(vEsperadoTotal)}</td>
                    <td class='td-perc'>${formatarPerc(vRealizadoTotal, vEsperadoTotal)}</td>
                    
                    <td style='padding: 8px;'>${vRealT1} / ${formatNum(vEspT1)}</td>
                    <td class='td-perc'>${formatarPerc(vRealT1, vEspT1)}</td>
                    
                    <td style='padding: 8px;'>${vRealT2} / ${formatNum(vEspT2)}</td>
                    <td class='td-perc'>${formatarPerc(vRealT2, vEspT2)}</td>
                    
                    <td style='padding: 8px;'>${vRealT3} / ${formatNum(vEspT3)}</td>
                    <td class='td-perc'>${formatarPerc(vRealT3, vEspT3)}</td>
                    
                    <td style='padding: 8px;'>${vRealT4} / ${formatNum(vEspT4)}</td>
                    <td class='td-perc'>${formatarPerc(vRealT4, vEspT4)}</td>
                    
                    <td style='padding: 8px; border-left: 2px solid #ddd;'>${vRealSem1} / ${formatNum(vEspSem1)}</td>
                    <td class='td-perc'>${formatarPerc(vRealSem1, vEspSem1)}</td>
                    
                    <td style='padding: 8px;'>${vRealSem2} / ${formatNum(vEspSem2)}</td>
                    <td class='td-perc'>${formatarPerc(vRealSem2, vEspSem2)}</td>
                    
                    <td style='padding: 8px;'>${vRealSem3} / ${formatNum(vEspSem3)}</td>
                    <td class='td-perc'>${formatarPerc(vRealSem3, vEspSem3)}</td>
                    
                    <td style='padding: 8px;'>${vRealSem4} / ${formatNum(vEspSem4)}</td>
                    <td class='td-perc'>${formatarPerc(vRealSem4, vEspSem4)}</td>
                    
                    <td style='padding: 8px;'>${vRealSem5} / ${formatNum(vEspSem5)}</td>
                    <td class='td-perc'>${formatarPerc(vRealSem5, vEspSem5)}</td>
                </tr>`;
            });

            // Montagem do Cabeçalho
            const cabecalhoHTML = `
                <tr>
                    <th style='padding: 8px; border: 1px solid #ddd; text-align: left;'>Analista</th>
                    <th style='padding: 8px; border: 1px solid #ddd;'>Real</th>
                    <th style='padding: 8px; border: 1px solid #ddd;'>Meta</th>
                    <th class='th-perc'>%</th>
                    <th style='padding: 8px; border: 1px solid #ddd;'>${rel1}</th>
                    <th class='th-perc'>%</th>
                    <th style='padding: 8px; border: 1px solid #ddd;'>${rel2}</th>
                    <th class='th-perc'>%</th>
                    <th style='padding: 8px; border: 1px solid #ddd;'>${rel3}</th>
                    <th class='th-perc'>%</th>
                    <th style='padding: 8px; border: 1px solid #ddd;'>${rel4}</th>
                    <th class='th-perc'>%</th>
                    <th style='padding: 8px; border: 1px solid #ddd; border-left: 2px solid #ddd;'>Sem 1</th>
                    <th class='th-perc'>%</th>
                    <th style='padding: 8px; border: 1px solid #ddd;'>Sem 2</th>
                    <th class='th-perc'>%</th>
                    <th style='padding: 8px; border: 1px solid #ddd;'>Sem 3</th>
                    <th class='th-perc'>%</th>
                    <th style='padding: 8px; border: 1px solid #ddd;'>Sem 4</th>
                    <th class='th-perc'>%</th>
                    <th style='padding: 8px; border: 1px solid #ddd;'>Sem 5</th>
                    <th class='th-perc'>%</th>
                </tr>`;

            // Montagem do Rodapé
            const rodapeHTML = `
                <tr style='background-color: #004578; color: white; text-align: center; height: 35px; font-weight: bold;'>
                    <td style='padding: 8px; text-align: left;'>TOTAL GERAL</td>
                    <td style='padding: 8px;'>${tReal}</td>
                    <td style='padding: 8px;'>${formatNum(tEsp)}</td>
                    <td class='rodape-perc'>${formatarPerc(tReal, tEsp)}</td>
                    
                    <td style='padding: 8px;'>${tRealT1} / ${formatNum(tEspT1)}</td>
                    <td class='rodape-perc'>${formatarPerc(tRealT1, tEspT1)}</td>
                    
                    <td style='padding: 8px;'>${tRealT2} / ${formatNum(tEspT2)}</td>
                    <td class='rodape-perc'>${formatarPerc(tRealT2, tEspT2)}</td>
                    
                    <td style='padding: 8px;'>${tRealT3} / ${formatNum(tEspT3)}</td>
                    <td class='rodape-perc'>${formatarPerc(tRealT3, tEspT3)}</td>
                    
                    <td style='padding: 8px;'>${tRealT4} / ${formatNum(tEspT4)}</td>
                    <td class='rodape-perc'>${formatarPerc(tRealT4, tEspT4)}</td>
                    
                    <td style='padding: 8px; border-left: 2px solid #558bb5;'>${tSem1} / ${formatNum(tEspSem1)}</td>
                    <td class='rodape-perc'>${formatarPerc(tSem1, tEspSem1)}</td>
                    
                    <td style='padding: 8px;'>${tSem2} / ${formatNum(tEspSem2)}</td>
                    <td class='rodape-perc'>${formatarPerc(tSem2, tEspSem2)}</td>
                    
                    <td style='padding: 8px;'>${tSem3} / ${formatNum(tEspSem3)}</td>
                    <td class='rodape-perc'>${formatarPerc(tSem3, tEspSem3)}</td>
                    
                    <td style='padding: 8px;'>${tSem4} / ${formatNum(tEspSem4)}</td>
                    <td class='rodape-perc'>${formatarPerc(tSem4, tEspSem4)}</td>
                    
                    <td style='padding: 8px;'>${tSem5} / ${formatNum(tEspSem5)}</td>
                    <td class='rodape-perc'>${formatarPerc(tSem5, tEspSem5)}</td>
                </tr>`;

            // Injetando no HTML
            document.getElementById("cabecalho-tabela").innerHTML = cabecalhoHTML;
            document.getElementById("corpo-tabela").innerHTML = corpoHTML;
            document.getElementById("rodape-tabela").innerHTML = rodapeHTML;
        }

        // --- GATILHOS DE ATUALIZAÇÃO ---
        carregarDados();
        setInterval(carregarDados, 30 * 60 * 1000);
    </script>
</body>
</html>
